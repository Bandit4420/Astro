name: AniList public API diagnosis
on:
  push:
    branches: [diagnostic/anilist-public-api]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Isolate query fields and filters
        env:
          MEDIA_FIELDS: "id idMal volumes studios(isMain:true) { nodes { name } } title { userPreferred native } coverImage { large color } bannerImage type format status\n            description(asHtml:false) episodes chapters duration averageScore seasonYear startDate { year } genres\n            nextAiringEpisode { episode airingAt } trailer { id site }"
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,time
          probes=[('full-fields','','',{}),
            ('sort','$sort:[MediaSort]',',sort:$sort',{'sort':['TRENDING_DESC']}),
            ('format-null','$format:MediaFormat',',format:$format',{'format':None}),
            ('exclude-null','$excluded:[MediaFormat]',',format_not_in:$excluded',{'excluded':None}),
            ('search-null','$search:String',',search:$search',{'search':None}),
            ('filters-null','$genre:String,$tag:String,$year:String,$season:MediaSeason,$status:MediaStatus,$score:Int,$episodes:Int,$minEpisodes:Int',',genre:$genre,tag:$tag,startDate_like:$year,season:$season,status:$status,averageScore_greater:$score,episodes_lesser:$episodes,episodes_greater:$minEpisodes',{})]
          for name,defs,args,variables in probes:
              query='query'+('('+defs+')' if defs else '')+' { Page(page:1,perPage:20) { media(type:ANIME,isAdult:false'+args+') { '+os.environ['MEDIA_FIELDS']+' } } }'
              req=urllib.request.Request('https://graphql.anilist.co',data=json.dumps({'query':query,'variables':variables}).encode(),headers={'Content-Type':'application/json','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      d=json.load(r);print(json.dumps({'probe':name,'status':r.status,'errors':d.get('errors'),'count':len(d.get('data',{}).get('Page',{}).get('media',[]))}),flush=True)
              except urllib.error.HTTPError as e: print(json.dumps({'probe':name,'status':e.code,'body':e.read().decode()[:1000]}),flush=True)
              except Exception as e: print(json.dumps({'probe':name,'error':str(e)}),flush=True)
              time.sleep(3)
          PY
